name: ecopulse
description: Monitoramento colaborativo de riscos ambientais urbanos.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  http: ^1.4.0
  sqflite: ^2.4.2
  path: ^1.9.1
  uuid: ^4.5.1
  flutter_secure_storage: ^10.0.0
  web_socket_channel: ^3.0.3
  connectivity_plus: ^6.1.4
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: 2.3.6
  sqlite3: ^2.9.4
flutter:
  uses-material-design: true
